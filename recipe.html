<style>
.basket{display:flex;gap:6px;padding:8px 12px;background:linear-gradient(#f8dc98,#f0cc7c);min-height:58px;align-items:center;flex-wrap:wrap;border-bottom:3px solid #e2b465}
.basket .lab{font:15px Jua,sans-serif;color:var(--cocoa2);margin-right:4px}
.basket .it{width:46px;height:38px;background:#fff9;border-radius:12px;display:grid;place-items:center;box-shadow:0 2px 0 #c9a77e}
.basket .it :is(svg,.art){width:40px;height:30px}
.basket .none{color:var(--cocoa2);font-size:14px}
.view{flex:1;position:relative;display:flex;flex-direction:column}
.goal{background:var(--cream);padding:8px 14px;font:16px Jua,sans-serif;color:var(--cocoa);text-align:center;border-bottom:3px solid #e2b465}
.map{position:relative;width:100%;aspect-ratio:1300/976;background:url('img/bg-map.webp') 50% 50%/cover,#8fcb63;overflow:hidden}
.map.tall{aspect-ratio:825/1100;background-image:url('img/bg-map-tall.webp')}
.loc{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:130px;z-index:2}
.badge{position:relative;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffdf6,#f3dfb4);box-shadow:0 6px 0 #b98f5f,0 12px 18px #0004;display:grid;place-items:center;transition:transform .2s}
.loc:hover .badge{transform:translateY(-3px)}
.badge :is(svg,.art){width:44px;height:36px}
.loc.open .badge{animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 6px 0 #b98f5f,0 0 0 8px #fff6a8dd,0 0 24px 10px #fff6a8aa}}
.loc.locked .badge{filter:grayscale(1) brightness(.9);opacity:.8}
.loc .nm{background:var(--cocoa);color:#ffe9b8;font:14px Jua,sans-serif;padding:2px 10px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 0 #0003}
.mark{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.mark :is(svg,.art){width:16px;height:16px}
.mark.ok{background:var(--leaf)}.mark.lk{background:#8a8f96}
.panel{flex:1;display:flex;flex-direction:column;background:linear-gradient(#fff7e6d0,#fff7e6e8),var(--bg) 50% 50%/cover,var(--cream)}
.ph{display:flex;align-items:center;gap:12px;padding:16px 14px;background:linear-gradient(90deg,#fff7e6f2 0,#fff7e6c0 45%,#fff7e600 80%),var(--bg) 50% 50%/cover;border-bottom:3px solid #e2b465;min-height:96px}
.ph img{width:56px;height:64px;object-fit:cover;object-position:top;border-radius:14px;background:#fff7}
.ph b{font:21px Jua,sans-serif;font-weight:400;color:var(--cocoa);display:block;line-height:1.1}
.ph small{color:var(--cocoa2);font-size:14px}
.ph .grow{flex:1}
.pb{flex:1;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ask{font-size:18px;max-width:580px;margin:0}
.ask b{font-family:Jua,sans-serif;font-weight:400;color:var(--berry)}
.mrow{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}
.scoops{display:grid;gap:10px}
.tile{min-height:52px;padding:0 18px;border-radius:16px;background:#fff;box-shadow:0 4px 0 #c9a77e;font:18px Jua,sans-serif;color:var(--cocoa)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #c9a77e}
.tile.on{background:var(--leaf);color:#fff;box-shadow:0 4px 0 #3c7a3c}
.now{font:20px Jua,sans-serif;color:var(--cocoa);margin:0}
.garden{display:grid;grid-template-columns:repeat(3,minmax(0,96px));gap:14px;justify-content:center}
.fl{position:relative;width:96px;height:96px;border-radius:26px;background:#e3f2d6;box-shadow:0 4px 0 #9cc98a;transition:transform .15s,background .15s}
.fl.lit{background:#fff6a8;transform:scale(1.08)}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile.ico{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;text-align:left}
.tile.ico .art{width:40px;height:44px;flex:none}
.tile.ico small{display:block;font-size:13px;opacity:.75}
.bowlbox{height:190px;display:flex;align-items:flex-end;justify-content:center}
.bowlimg{height:180px;width:auto}
.bowlimg.wait{animation:wob 1s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.bowlimg.grow{animation:grow .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes grow{from{transform:scale(.85)}}
.meter{position:relative;width:min(440px,92%);height:36px;background:#eadfcb;border-radius:18px;overflow:hidden;box-shadow:inset 0 2px 4px #0002}
.zone{position:absolute;top:0;bottom:0;background:#9ee08f}
.needle{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:var(--berry);border-radius:4px}
.prog{width:min(300px,80%);height:14px;background:#eadfcb;border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:#f5d04a;transition:width .3s}
.stalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;width:100%;max-width:660px}
.stall{background:#fff;border-radius:16px;padding:8px;box-shadow:0 4px 0 #c9a77e;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent;color:var(--ink)}
.stall.on{border-color:var(--leaf);background:#eef8ea}
.stall :is(svg,.art){width:56px;height:40px}
.stall b{font:16px Jua,sans-serif;font-weight:400;line-height:1.15}
.stall small{color:var(--cocoa2);font-size:13px}
.stall .pr{font:20px Jua,sans-serif;color:var(--cocoa)}
.local{background:var(--leaf);color:#fff;border-radius:8px;padding:0 7px;font-size:12px}
.total{font:22px Jua,sans-serif;margin:0}
.total.over{color:var(--berry)}
.choices{display:grid;gap:10px;width:min(440px,100%)}
.wts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.steps{display:grid;gap:8px;width:min(540px,100%)}
.step{min-height:50px;border-radius:14px;background:#fff;box-shadow:0 4px 0 #c9a77e;text-align:left;padding:8px 14px;display:flex;gap:10px;align-items:center;font-size:16px;color:var(--ink)}
.step .n{width:30px;height:30px;border-radius:50%;background:#eadfcb;display:grid;place-items:center;font:16px Jua,sans-serif;flex:none}
.step.done{background:#eef8ea;box-shadow:0 4px 0 #9cc98a}
.step.done .n{background:var(--leaf);color:#fff}
.got{display:flex;justify-content:center;gap:10px;margin:6px 0}
.got :is(svg,.art){width:96px;height:70px}
.book{display:grid;gap:10px}
.rc{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px;box-shadow:0 3px 0 #e6cfa8}
.rc :is(svg,.art){width:90px;height:64px}
.rc b{font:18px Jua,sans-serif;font-weight:400;color:var(--cocoa)}
.rc .ing{display:flex;gap:2px;flex-wrap:wrap}
.rc .ing :is(svg,.art){width:34px;height:26px}
.rc.lock{opacity:.55}.rc.lock :is(svg,.art){filter:grayscale(1)}
.letter{background:#fffdf3;border:2px dashed #d9c39a;border-radius:14px;padding:12px 14px;font-style:italic;margin:6px 0}
@media(max-width:560px){.loc{width:100px}.badge{width:42px;height:42px}.badge :is(svg,.art){width:34px;height:28px}.loc .nm{font-size:11px;padding:1px 6px}.mark{width:18px;height:18px}.mark svg{width:11px;height:11px}.garden{grid-template-columns:repeat(3,minmax(0,84px))}.fl{width:84px;height:84px}.fl .f{width:68px;height:68px}}
.jugbox{position:relative;width:176px;height:178px;flex:none}
.jugbox>.art{width:100%;height:100%}
.jugbox svg{position:absolute;inset:0;width:100%;height:100%}
.jl{position:absolute;left:58%;transform:translateY(-55%);font:12px Jua,sans-serif;color:var(--cocoa);text-shadow:0 0 3px #fff,0 0 3px #fff}
.fl .f{width:80px;height:80px}
.fl .bee{position:absolute;right:-12px;top:-14px;width:54px;height:54px}
.churnbox{position:relative;display:flex;align-items:flex-end;gap:10px;height:190px}
.churnimg{height:180px;width:auto}
.bbowl{height:84px;width:auto;transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1);transform-origin:bottom center}
.balbox{position:relative;width:min(320px,86%);aspect-ratio:311/300}
.balbox .lay{position:absolute;inset:0;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.balbox .lay>.art{width:100%;height:100%}
.balbox .arms{transform-origin:50% 16.5%}
.onpan{position:absolute;bottom:35%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:1px}
.parcel{position:relative;width:min(78px,22vw)}
.parcel .art{width:100%;height:auto}
.parcel b,.wt b{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font:12px Jua,sans-serif;color:#fff;background:#3a2214cc;padding:0 5px;border-radius:6px;white-space:nowrap}
.wt{position:relative}.wt .art{height:auto}.wt.s .art{width:26px}.wt.l .art{width:34px}
.wt b{top:62%;background:none;font-size:11px}
</style>

<body>
<div class="wrap">
 <div class="top">
  <h1>Secret Recipe Hunt</h1>
  <button class="ib" id="bBook">Recipe book</button>
  <button class="ib" id="bSnd">Sound on</button>
  <a class="ib" href="index.html">Main Street</a>
 </div>
 <div class="game" id="game">
  <div class="hud"><span>Find Old Gus's lost recipes</span><span class="grow"></span><span id="hPages"></span></div>
  <div class="basket" id="basket"></div>
  <div class="view" id="view"></div>
  <div class="toast" id="toast"></div>
  <div class="ov" id="ov"><div class="card" id="card"></div></div>
 </div>
</div>
<script src="art.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem('sunbake_'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('sunbake_'+k,JSON.stringify(v))}catch(e){}}};
let P=store.get('hunt')||{done:{},items:[],recipes:[],intro:false};
const save=()=>store.set('hunt',P);
let muted=!!store.get('muted');
let AC;function snd(k){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const seq={tap:[[420,.05]],good:[[660,.07],[880,.1]],win:[[523,.1],[659,.1],[784,.1],[1047,.2]],bad:[[180,.2]],buzz:[[300,.08]]}[k];let t=AC.currentTime;for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=k==='bad'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.85;}}catch(e){}}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600);}
const pic=(n,m='happy')=>`<img class="pt" src="img/${n}-${m}.webp" alt="">`;
const CHECK='<svg viewBox="0 0 16 16"><path d="M3 8l3 3 7-7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>';
const LOCK='<svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="2" fill="#fff"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="#fff" stroke-width="2" fill="none"/></svg>';

const NAMES={grandma:'Grandma Rose',walter:'Mr. Walter',lily:'Little Lily',maria:'Maria the florist',c1:'Jess from the orchard',c4:'Dot the mail carrier',c5:'Sam the dairy farmer',me:'',gus:'Old Gus'};
const ITEMN={flour:'Flour',honey:'Honey',yeast:'Yeast',butter:'Butter',sugar:'Sugar',egg:'Eggs',milk:'Milk',apple:'Apples',cinnamon:'Cinnamon'};
const LOC={
 bakery:{name:'Sunny Side Bakery',icon:'loaf',d:[53,60],m:[52,58]},
 mill:{name:'Old Mill',icon:'flour',npc:'walter',gives:['flour'],d:[25,33],m:[25,30]},
 apiary:{name:'Honey Hill',icon:'honey',npc:'lily',gives:['honey'],d:[73,28],m:[78,26]},
 cellar:{name:'Bakery Cellar',icon:'yeast',npc:'grandma',gives:['yeast'],d:[35,49],m:[16,52]},
 dairy:{name:'Meadow Dairy',icon:'butter',npc:'c5',gives:['butter'],d:[14,61],m:[17,71]},
 market:{name:'Farmers Market',icon:'egg',npc:'maria',gives:['sugar','egg','milk'],d:[85,58],m:[76,73]},
 orchard:{name:'Apple Orchard',icon:'apple',npc:'c1',gives:['apple'],d:[30,86],m:[25,90]},
 post:{name:'Post Office',icon:'cinnamon',npc:'c4',gives:['cinnamon'],d:[75,90],m:[80,93]}};
const CH=[['mill','apiary','cellar'],['dairy','market'],['orchard','post']];
const RECIPES=[
 {name:'Honey Wheat Bread',bread:'loaf',needs:['flour','honey','yeast'],steps:['Measure the flour and honey','Mix them with warm water and yeast','Knead the dough until smooth','Let the dough rise for an hour','Bake until golden brown']},
 {name:'Golden Butter Croissants',bread:'cro',needs:['flour','yeast','butter','sugar','egg','milk'],steps:['Mix flour, sugar, yeast, and milk','Wrap a slab of cold butter in the dough','Roll and fold the dough three times','Cut triangles and roll them into crescents','Brush with egg and bake']},
 {name:'Apple Cinnamon Donuts',bread:'donut',needs:['flour','sugar','egg','butter','apple','cinnamon'],steps:['Chop the apples into tiny pieces','Stir flour, sugar, and cinnamon together','Mix in eggs, melted butter, and apples','Shape the dough into rings','Fry until golden and roll in cinnamon sugar']}];
const NPC={
 mill:['Gus and I ground wheat here every Saturday. He measured flour with three little scoops. Can you do it his way?','mid'],
 apiary:['The bees are dancing! Gus said if you copy their dance, they will share their honey.','happy'],
 cellar:['Gus kept his yeast down here. Yeast is alive, you know. Let us see what wakes it up.','mid'],
 dairy:['Want butter? Churn the cream with a steady beat. My baby loves the sound.','happy'],
 market:['Welcome to the farmers market! Gus shopped here every week. You need eggs, sugar, and milk, and you have $8.','happy'],
 orchard:['Gus left a note full of baking math on this tree. Solve it and the apples are yours!','happy'],
 post:['I have a package for the bakery, but I can only send it when the scale balances. Can you help?','mid']};
const FACT={
 mill:['Fractions in the kitchen','1/2 cup is the same as 2/4 cup or 4/8 cup. Bakers swap scoops like this all the time.'],
 apiary:['Bee science','Honeybees really do a "waggle dance" to tell other bees where flowers are. One bee makes only about 1/12 of a teaspoon of honey in its whole life!'],
 cellar:['Kitchen chemistry','Yeast is a tiny living fungus. It eats sugar and gives off carbon dioxide gas, and those bubbles make bread rise. Water hotter than about 140°F kills it.'],
 dairy:['Kitchen science','Churning makes tiny drops of fat in cream bump and stick together into butter. The liquid left over is called buttermilk.'],
 market:['Local economy','When you buy from local farmers, more of your money stays in your town and helps your neighbors keep their farms.'],
 orchard:['Scaling recipes','To double a recipe, multiply every ingredient by 2. To make half, divide every ingredient by 2.'],
 post:['Math balance','A balance scale works like an equation. Both sides must be equal, just like 11 = 8 + 2 + 1.'],
 steps:['Recipes are algorithms','A recipe is a list of steps in an exact order. Change the order and you change what comes out of the oven!']};

/* ---------- story overlay ---------- */
function showOv(h,acts){$('card').innerHTML=h;$('ov').classList.add('on');$('card').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{snd('tap');acts[b.dataset.a]&&acts[b.dataset.a](b);});const f=$('card').querySelector('.row .btn:last-child');f&&f.focus({preventScroll:true});}
const hideOv=()=>$('ov').classList.remove('on');
function story(lines,cb){let i=0;const show=()=>{const[w,txt,md]=lines[i];
 const face=w==='narr'?pic('me','mid'):pic(w,md||'happy');
 showOv(`<div class="story">${face}<div><div class="who">${w==='narr'?'&nbsp;':NAMES[w]}</div><div class="txt">${w==='gus'?`<div class="letter">${txt}</div>`:txt}</div></div></div><div class="row">${i<lines.length-1?'<button class="btn alt" data-a="s">Skip story</button>':''}<button class="btn" data-a="n">Next</button></div>`,{n:()=>{i++;i<lines.length?show():(hideOv(),cb&&cb());},s:()=>{hideOv();cb&&cb();}});};show();}

/* ---------- map ---------- */
const chapter=()=>P.recipes.length;
function state(id){if(id==='bakery'){const c=chapter();return c<3&&CH[c].every(l=>P.done[l])?'open':'idle';}
 if(P.done[id])return 'done';const c=chapter();if(c<3&&CH[c].includes(id))return 'open';return 'locked';}
function goalText(){const c=chapter();if(c>=3)return 'You found every recipe! Visit the recipe book anytime.';
 if(CH[c].every(l=>P.done[l]))return `All ingredients for page ${c+1} found! Bake at Sunny Side Bakery.`;
 return `Page ${c+1} of 3: visit the glowing places to collect ingredients.`;}
function basket(){const have=[...new Set(P.items)];$('basket').innerHTML='<span class="lab">Basket</span>'+(have.length?have.map(i=>`<span class="it" title="${ITEMN[i]}">${ART.item(i)}</span>`).join(''):'<span class="none">Empty for now</span>');$('hPages').textContent=`Recipe pages: ${P.recipes.length} / 3`;}
const narrow=()=>matchMedia('(max-width:560px)').matches;
function renderMap(){stop();basket();const k=narrow()?'m':'d';
 $('view').innerHTML=`<div class="goal">${goalText()}</div><div class="map ${k==='m'?'tall':''}">${Object.entries(LOC).map(([id,l])=>{const s=state(id);const[x,y]=l[k];return`<button class="loc ${s}" data-loc="${id}" style="left:${x}%;top:${y}%"><span class="badge">${ART.item(l.icon)}${s==='done'?`<span class="mark ok">${CHECK}</span>`:s==='locked'?`<span class="mark lk">${LOCK}</span>`:''}</span><span class="nm">${l.name}</span></button>`;}).join('')}</div>`;
 $('view').querySelectorAll('.loc').forEach(el=>el.onclick=()=>visit(el.dataset.loc));}
function visit(id){const s=state(id);snd('tap');
 if(id==='bakery'){if(s==='open'){const c=chapter();story([['grandma',`You found everything for page ${c+1}: ${RECIPES[c].name}! Gus's steps got mixed up, though. Put them back in order.`,'happy']],()=>pSteps(c));}else toast(chapter()>=3?'The ovens are warm and the recipe book is full!':'Collect the ingredients first.');return;}
 if(s==='locked'){toast('Finish the earlier recipe pages first.');return;}
 if(s==='done'){toast('You already visited here.');return;}
 const[line,md]=NPC[id];story([[LOC[id].npc,line,md]],()=>PZ[id]());}
const BG={mill:'mill',apiary:'apiary',cellar:'cellar',dairy:'dairy',market:'market',orchard:'orchard',post:'post',bakery:'kitchen'};
function panel(id,sub){const l=LOC[id]||LOC.bakery;const npc=l.npc||'grandma';
 $('view').innerHTML=`<div class="panel" style="--bg:url('img/bg-${BG[id]}.webp')"><div class="ph">${pic(npc,'happy').replace('class="pt"','')}<div class="grow"><b>${l.name}</b><small>${sub}</small></div><button class="ib" id="back">Map</button></div><div class="pb" id="pb"></div></div>`;
 $('back').onclick=()=>{snd('tap');renderMap();};return $('pb');}
let timers=[],raf=0;function stop(){timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);document.onkeydown=null;}
const later=(f,ms)=>timers.push(setTimeout(f,ms));
function win(id){stop();P.done[id]=true;for(const g of LOC[id].gives)if(!P.items.includes(g))P.items.push(g);save();snd('win');basket();
 const c=chapter(),all=CH[c].every(l=>P.done[l]);const[ft,fx]=FACT[id];
 showOv(`<h2>You got ${LOC[id].gives.map(g=>ITEMN[g]).join(', ')}!</h2><div class="got">${LOC[id].gives.map(g=>ART.item(g)).join('')}</div><div class="fact"><b>${ft}</b>${fx}</div>${all?`<p><b>That is every ingredient for recipe page ${c+1}.</b> Head back to Sunny Side Bakery to bake it.</p>`:''}<div class="row"><button class="btn" data-a="m">Back to the map</button></div>`,{m:()=>{hideOv();renderMap();}});}

/* ---------- puzzles ---------- */
const gcd=(a,b)=>b?gcd(b,a%b):a;
function fr(n){const w=Math.floor(n/8),r=n%8;if(!r)return`${w}`;const g=gcd(r,8);const f=`${r/g}/${8/g}`;return w?`${w} ${f}`:f;}
function pMeasure(){const pb=panel('mill','Fill the cup with exactly the right amount');const T=[6,5,12];let r=0,have=0;
 const xl=y=>15+(y-15)/69*2,xr=y=>70-(y-15)/69*3;
 const jug=()=>{const top=84-have/16*51;const path=have?`M${xl(top)} ${top}L${xr(top)} ${top}L${xr(84)} 84Q${xr(84)} 88 ${xr(84)-4} 88L${xl(84)+4} 88Q${xl(84)} 88 ${xl(84)} 84Z`:'';
  return`<div class="jugbox"><img class="art" src="img/lab/jug.webp" alt="Measuring cup"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${have?`<path d="${path}" fill="#f2e2c0" opacity=".93"/><path d="M${xl(top)} ${top}L${xr(top)} ${top}" stroke="#fffaf0" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`:''}</svg>${[4,8,12,16].map(n=>`<span class="jl" style="top:${84-n/16*51}%">${fr(n)}</span>`).join('')}</div>`;};
 const draw=()=>{pb.innerHTML=`<p class="ask">Round ${r+1} of 3: Gus's note says <b>${fr(T[r])} cup</b> of flour. Use the scoops to fill the cup exactly.</p><div class="mrow">${jug()}<div class="scoops">${[[4,'1/2 cup scoop','scoop-l'],[2,'1/4 cup scoop','scoop-m'],[1,'1/8 cup scoop','scoop-s']].map(([v,l,im])=>`<button class="tile ico" data-v="${v}"><img class="art" src="img/lab/${im}.webp" alt=""><span>${l}</span></button>`).join('')}<button class="btn alt" data-v="0">Pour it out</button></div></div><p class="now">In the cup: ${have?fr(have):'0'} cup</p>`;
  pb.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=+b.dataset.v;if(!v){have=0;snd('tap');draw();return;}have+=v;
   if(have===T[r]){snd('good');draw();toast('Exactly right!');r++;later(()=>{have=0;r<3?draw():win('mill');},900);}
   else if(have>T[r]){snd('bad');toast('Oops, too much! The flour spilled.');draw();later(()=>{have=0;draw();},700);}else{snd('tap');draw();}});};draw();}
const FL=[['pink',''],['purple',''],['blue',''],['pink','hue-rotate(-38deg) saturate(1.7)'],['blue','hue-rotate(175deg) saturate(1.4)'],['purple','saturate(0) brightness(1.55)']];
function flower(i){const[b,f]=FL[i];return`<img class="art f" src="img/lab/fl-${b}.webp" alt="" style="filter:${f||'none'}">`;}
const BEE='<img class="art bee" src="img/lab/bee.webp" alt="">';
function pBees(){const pb=panel('apiary','Copy the bee dance');const COLS=[0,1,2,3,4,5];let r=0,seq=[],pos=0,busy=true;
 pb.innerHTML=`<p class="ask" id="bmsg"></p><div class="garden">${COLS.map(i=>`<button class="fl" data-i="${i}" aria-label="Flower ${i+1}">${flower(i)}</button>`).join('')}</div><button class="btn alt" id="replay">Watch again</button>`;
 const fls=[...pb.querySelectorAll('.fl')],msg=pb.querySelector('#bmsg');
 const lit=(i,on)=>{fls[i].classList.toggle('lit',on);const b=fls[i].querySelector('.bee');if(on&&!b)fls[i].insertAdjacentHTML('beforeend',BEE);if(!on&&b)b.remove();};
 const watch=()=>{busy=true;pos=0;msg.innerHTML=`Round ${r+1} of 3: watch where the bee lands (${seq.length} flowers).`;seq.forEach((f,k)=>{later(()=>{lit(f,true);snd('buzz');},600+k*700);later(()=>lit(f,false),600+k*700+450);});later(()=>{busy=false;msg.innerHTML='Your turn! Tap the flowers in the same order.';},600+seq.length*700);};
 const round=()=>{seq=Array.from({length:3+r},()=>Math.floor(Math.random()*6));watch();};
 fls.forEach((el,i)=>el.onclick=()=>{if(busy)return;lit(i,true);later(()=>lit(i,false),250);
  if(i===seq[pos]){pos++;snd('tap');if(pos===seq.length){busy=true;snd('good');toast('The bees love it!');r++;later(()=>r<3?round():win('apiary'),900);}}
  else{busy=true;snd('bad');pb.querySelector('.garden').classList.add('shake');msg.textContent='Oops! Watch the dance again.';later(()=>{pb.querySelector('.garden').classList.remove('shake');watch();},900);}});
 pb.querySelector('#replay').onclick=()=>{if(!busy){snd('tap');watch();}};round();}
function pYeast(){const pb=panel('cellar','Wake up the yeast');let temp=null,food=null;
 const RES={'warm-sugar':['big','The dough puffed up big and bubbly! Warm water and sugar make yeast happy.',true],'warm-salt':['mid','A small rise. Salt slows yeast down. Yeast needs food like sugar.'],'cold-sugar':['mid','A slow, small rise. Cold water makes yeast sleepy.'],'cold-salt':['flat','Almost nothing happened. Too cold, and no food.'],'hot-sugar':['flat','Nothing happened. Water that hot is too much for yeast.'],'hot-salt':['flat','Nothing happened. That water was far too hot.']};
 const lab=(n,c='')=>`<img class="art ${c}" src="img/lab/${n}.webp" alt="" draggable="false">`;
 const draw=(st='flat',txt='Pick the water and the food, then mix.',anim='')=>{pb.innerHTML=`<p class="ask">Gus's yeast needs the right water and the right food. Run an experiment!</p><div class="opts">${[['cold','Cold water','50°F','w-cold'],['warm','Warm water','105°F','w-warm'],['hot','Hot water','160°F','w-hot']].map(([k,l,t,im])=>`<button class="tile ico ${temp===k?'on':''}" data-t="${k}">${lab(im)}<span>${l}<small>${t}</small></span></button>`).join('')}</div><div class="opts">${[['sugar','A spoon of sugar','spoon-sugar'],['salt','A spoon of salt','spoon-salt']].map(([k,l,im])=>`<button class="tile ico ${food===k?'on':''}" data-f="${k}">${lab(im)}<span>${l}</span></button>`).join('')}</div><div class="bowlbox">${lab('bowl-'+st,'bowlimg '+anim)}</div><p class="now" style="font-size:18px">${txt}</p><div class="row" style="justify-content:center"><button class="btn" id="mix" ${temp&&food?'':'disabled'}>Mix and wait</button></div>`;
  pb.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{temp=b.dataset.t;snd('tap');draw();});
  pb.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{food=b.dataset.f;snd('tap');draw();});
  pb.querySelector('#mix').onclick=()=>{const[res,t,ok]=RES[temp+'-'+food];draw('flat','Waiting while the yeast works...','wait');pb.querySelector('#mix').disabled=true;
   later(()=>{draw(res,t,'grow');if(ok){snd('good');const m=pb.querySelector('#mix');m.textContent='Take the yeast';m.disabled=false;m.onclick=()=>win('cellar');}else snd('bad');},2200);};};draw();}
function pChurn(){const pb=panel('dairy','Churn the cream into butter');let hits=0,w=26,t=0,last=performance.now();const NEED=6;
 pb.innerHTML=`<p class="ask">Tap <b>Churn!</b> when the red marker is in the green zone. You need ${NEED} good churns.</p><div class="churnbox"><img class="art churnimg" id="cimg" src="img/lab/churn-up.webp" alt="Butter churn"><img class="art bbowl" id="bb" src="img/lab/butter-bowl.webp" alt="Butter" style="opacity:0;transform:scale(.55)"></div><div class="meter"><span class="zone" id="zone"></span><span class="needle" id="needle"></span></div><div class="prog"><i id="prog" style="width:0"></i></div><button class="btn leaf" id="churn" style="min-width:180px">Churn!</button>`;
 new Image().src='img/lab/churn-down.webp';
 const zone=pb.querySelector('#zone'),needle=pb.querySelector('#needle'),cimg=pb.querySelector('#cimg'),bb=pb.querySelector('#bb');let x=0;
 const place=()=>{zone.style.left=(50-w/2)+'%';zone.style.width=w+'%';};place();
 const loop=n=>{t+=(n-last)/1000*(1.6+hits*.12);last=n;x=(Math.sin(t*2)+1)/2*100;needle.style.left=x+'%';raf=requestAnimationFrame(loop);};raf=requestAnimationFrame(loop);
 const go=()=>{cimg.src='img/lab/churn-down.webp';later(()=>cimg.src='img/lab/churn-up.webp',160);
  if(Math.abs(x-50)<=w/2){hits++;w=Math.max(12,w-2.5);place();snd('good');pb.querySelector('#prog').style.width=hits/NEED*100+'%';bb.style.opacity=hits/NEED;bb.style.transform=`scale(${.55+.45*hits/NEED})`;toast(hits<NEED?`Good churn! ${NEED-hits} to go.`:'Butter!');if(hits>=NEED){cancelAnimationFrame(raf);later(()=>win('dairy'),700);}}
  else{snd('bad');toast(x<50?'A little too early!':'A little too late!');}};
 pb.querySelector('#churn').onclick=go;document.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();go();}};}
function pMarket(){const pb=panel('market','Shop for eggs, sugar, and milk with $8');
 const S=[{k:'egg',n:'Eggs, one dozen',p:3,shop:'Big Box Store'},{k:'egg',n:'Farm fresh eggs',p:4,shop:'Farmer Joe',local:1},{k:'sugar',n:'Sugar',p:2,shop:'Big Box Store'},{k:'sugar',n:'Cane sugar',p:3,shop:'Main Street Co-op',local:1},{k:'milk',n:'Milk',p:2,shop:'Big Box Store'},{k:'milk',n:'Meadow milk',p:3,shop:'Meadow Dairy',local:1},{k:'choc',n:'Chocolate chips',p:4,shop:'Big Box Store'},{k:'sprk',n:'Sprinkles',p:2,shop:'Candy Corner'}];
 const on=new Set();
 const draw=(note='')=>{const tot=[...on].reduce((a,i)=>a+S[i].p,0);pb.innerHTML=`<p class="ask">Gus's croissants need <b>eggs</b>, <b>sugar</b>, and <b>milk</b>. You have <b>$8</b>. Tap items to put them in your bag.</p><div class="stalls">${S.map((s,i)=>`<button class="stall ${on.has(i)?'on':''}" data-i="${i}">${ART.item(s.art||s.k)}<b>${s.n}</b><small>${s.shop} ${s.local?'<span class="local">local</span>':''}</small><span class="pr">$${s.p}</span></button>`).join('')}</div><p class="total ${tot>8?'over':''}">Bag total: $${tot} of $8</p>${note?`<p class="now" style="font-size:17px">${note}</p>`:''}<button class="btn" id="pay">Pay</button>`;
  pb.querySelectorAll('.stall').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;on.has(i)?on.delete(i):on.add(i);snd('tap');draw();});
  pb.querySelector('#pay').onclick=()=>{const have=new Set([...on].map(i=>S[i].k));const miss=['egg','sugar','milk'].filter(k=>!have.has(k)).map(k=>ITEMN[k].toLowerCase());
   if(miss.length){snd('bad');draw(`You still need ${miss.join(' and ')}.`);return;}
   if(tot>8){snd('bad');draw(`That is $${tot-8} over budget. Try swapping something.`);return;}
   const loc=[...on].filter(i=>S[i].local).length;LOC.market.bonus=loc;win('market');if(loc)later(()=>toast(`You bought ${loc} local item${loc>1?'s':''}. Your neighbors say thanks!`),400);};};draw();}
function pScale(){const pb=panel('orchard','Solve Gus\'s baking math');
 const Q=[['Gus\'s honey bread uses 1/2 cup of honey for 1 loaf. How much honey for 2 loaves?',['1/4 cup','1 cup','2 cups'],1,'Two loaves means two halves. What is 1/2 + 1/2?'],['His donut recipe makes 12 donuts with 3/4 cup of sugar. How much sugar for 6 donuts?',['3/8 cup','1 1/2 cups','3/4 cup'],0,'6 donuts is half of 12. What is half of 3/4?'],['Each apple pie needs 6 apples. How many apples for 3 pies?',['9 apples','12 apples','18 apples'],2,'Count by sixes three times: 6, 12, ...']];let r=0;
 const draw=(hint='')=>{const[q,o]=Q[r];pb.innerHTML=`<p class="ask">Question ${r+1} of 3</p><p class="ask" style="font-size:20px">${q}</p><div class="choices">${o.map((x,i)=>`<button class="tile" data-i="${i}">${x}</button>`).join('')}</div>${hint?`<p class="now" style="font-size:17px">Hint: ${hint}</p>`:''}`;
  pb.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(+b.dataset.i===Q[r][2]){b.classList.add('on');snd('good');toast('Correct!');r++;later(()=>r<3?draw():win('orchard'),700);}else{snd('bad');b.classList.add('shake');later(()=>draw(Q[r][3]),450);}});};draw();}
function pBalance(){const pb=panel('post','Balance the scale');const T=[5,7,11],W=[1,2,4,8];let r=0;const on=new Set();
 const L='img/lab/';
 const build=()=>{pb.innerHTML=`<p class="ask" id="bq"></p><div class="balbox" id="bal"><div class="lay" id="lyL"><img class="art" src="${L}scale-panL.webp" alt=""><div class="onpan" style="left:17.5%"><span class="parcel"><img class="art" src="${L}parcel.webp" alt="Parcel"><b id="ptag"></b></span></div></div><div class="lay" id="lyR"><img class="art" src="${L}scale-panR.webp" alt=""><div class="onpan" id="wts" style="left:82.5%"></div></div><img class="art lay" src="${L}scale-stand.webp" alt=""><img class="art lay arms" id="arms" src="${L}scale-arms.webp" alt="Balance scale"></div><div class="wts">${W.map(v=>`<button class="tile ico" data-w="${v}"><img class="art" src="${L}weight-${v>2?'l':'s'}.webp" alt="" style="height:${v>2?44:32}px"><span>${v} lb</span></button>`).join('')}</div><p class="now" id="rs"></p>`;
  pb.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const v=+b.dataset.w;on.has(v)?on.delete(v):on.add(v);snd('tap');update();const tot=[...on].reduce((a,b)=>a+b,0);if(tot===T[r]){snd('good');toast('Balanced!');r++;later(()=>{on.clear();if(r<3)update();else win('post');},1100);}});update();};
 const update=()=>{const right=[...on].reduce((a,b)=>a+b,0),left=T[r];const ang=Math.max(-12,Math.min(12,(right-left)*2.5));
  pb.querySelector('#bq').innerHTML=`Round ${r+1} of 3: The package weighs <b>${left} pounds</b>. Add weights to the right side until the scale balances.`;
  pb.querySelector('#ptag').textContent=`${left} lb`;
  pb.querySelector('#wts').innerHTML=[...on].sort((a,b)=>b-a).map(v=>`<span class="wt ${v>2?'l':'s'}"><img class="art" src="${L}weight-${v>2?'l':'s'}.webp" alt=""><b>${v}</b></span>`).join('');
  const bal=pb.querySelector('#bal'),Wd=bal.clientWidth,dy=0.325*Wd*Math.sin(ang*Math.PI/180);
  pb.querySelector('#arms').style.transform=`rotate(${ang}deg)`;pb.querySelector('#lyL').style.transform=`translateY(${-dy}px)`;pb.querySelector('#lyR').style.transform=`translateY(${dy}px)`;
  pb.querySelectorAll('[data-w]').forEach(b=>b.classList.toggle('on',on.has(+b.dataset.w)));
  pb.querySelector('#rs').textContent=`Right side: ${right} lb`;};
 build();}
function pSteps(c){const R=RECIPES[c];const pb=panel('bakery',`Bake recipe page ${c+1}: ${R.name}`);const order=R.steps.map((s,i)=>i).sort(()=>Math.random()-.5);let next=0;
 const draw=()=>{pb.innerHTML=`<p class="ask">Tap Gus's steps in the right order, from first to last.</p><div class="steps">${order.map(i=>`<button class="step ${i<next?'done':''}" data-i="${i}" ${i<next?'disabled':''}><span class="n">${i<next?i+1:''}</span>${R.steps[i]}</button>`).join('')}</div>`;
  pb.querySelectorAll('.step').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===next){next++;snd('good');draw();if(next===R.steps.length)later(()=>bake(c),600);}else{snd('bad');b.classList.add('shake');later(()=>b.classList.remove('shake'),400);toast('Not yet! Think about what comes first.');}});};draw();}
function bake(c){stop();const R=RECIPES[c];P.recipes.push(c);save();snd('win');basket();const[ft,fx]=FACT.steps;
 showOv(`<h2>Recipe page ${c+1} complete!</h2><div class="got">${ART.bread(R.bread)}</div><p style="text-align:center;font:20px Jua,sans-serif">${R.name}</p>${c===0?`<div class="fact"><b>${ft}</b>${fx}</div>`:''}<p>${c<2?'A new part of town is open on the map.':'That was the last page!'}</p><div class="row"><button class="btn" data-a="n">${c<2?'Back to the map':'Read the last note'}</button></div>`,{n:()=>{if(c<2){hideOv();renderMap();}else ending();}});}
function ending(){story([['narr','Folded inside the last recipe page is one more note from Gus.'],['gus','You found them all! I am not lost, I just retired to sunny Florida. My recipes belong on Main Street, with someone who loves this town as much as I do. Bake them with joy. Your friend, Gus'],['grandma','That old rascal! He sent us on a treasure hunt all over town.','happy'],['walter','Well, I\'ll be. Now, who wants to taste that honey wheat bread?','happy']],()=>{renderMap();showOv(`<h2>All of Gus's recipes found!</h2><div class="got">${RECIPES.map(r=>ART.bread(r.bread)).join('')}</div><p>You explored the whole town, solved every puzzle, and saved three family recipes.</p><div class="row"><button class="btn alt" data-a="r">Play again</button><a class="btn" href="index.html">Main Street</a></div>`,{r:()=>{P={done:{},items:[],recipes:[],intro:false};save();hideOv();start();}});});}
const PZ={mill:pMeasure,apiary:pBees,cellar:pYeast,dairy:pChurn,market:pMarket,orchard:pScale,post:pBalance};

function book(){showOv(`<h2>Gus's recipe book</h2><div class="book">${RECIPES.map((r,i)=>{const got=P.recipes.includes(i);return`<div class="rc ${got?'':'lock'}">${ART.bread(r.bread)}<div><b>${got?r.name:'Missing page '+(i+1)}</b><div class="ing">${r.needs.map(n=>ART.item(n)).join('')}</div><small>${got?'Baked!':'Find the ingredients to unlock'}</small></div></div>`;}).join('')}</div><div class="row"><button class="btn" data-a="c">Close</button></div>`,{c:hideOv});}
$('bBook').onclick=()=>{snd('tap');book();};
const sndLab=()=>$('bSnd').textContent=muted?'Sound off':'Sound on';sndLab();
$('bSnd').onclick=()=>{muted=!muted;store.set('muted',muted);sndLab();snd('tap');};
let wasNarrow=narrow();addEventListener('resize',()=>{if(narrow()!==wasNarrow){wasNarrow=narrow();if($('view').querySelector('.map'))renderMap();}});
function start(){renderMap();if(!P.intro)story([['c4','Special delivery for Sunny Side Bakery! This one is all the way from Old Gus.','happy'],['gus','To whoever finds this: I have hidden my three best recipe pages around town. Follow the ingredients and you will find them. Start at the Old Mill.'],['grandma','Gus! He taught me to bake when I was your age. He always did love a good mystery.','happy'],['grandma','Tap a glowing place on the map to start. I will keep the ovens warm.','happy']],()=>{P.intro=true;save();renderMap();});}
start();
}
</script>
